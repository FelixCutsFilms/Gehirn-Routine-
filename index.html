<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Gehirn Routine</title>
<meta name="theme-color" content="#5b4bdb">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Gehirn Routine">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<style>
:root{--bg:#f6f5fb;--card:#fff;--fg:#1d1b2e;--muted:#6b6880;--accent:#5b4bdb;--accent2:#b5adf2;--ok:#1f9d63;--bad:#d93c4a;--line:#e3e0f1;--btn:#ece9fa}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14131f;--card:#1f1d2e;--fg:#f0eefc;--muted:#a09db8;--accent:#8b7dff;--accent2:#4a4390;--ok:#3ccf8e;--bad:#ff6b78;--line:#2e2b45;--btn:#2a2740}}
:root[data-theme="dark"]{--bg:#14131f;--card:#1f1d2e;--fg:#f0eefc;--muted:#a09db8;--accent:#8b7dff;--accent2:#4a4390;--ok:#3ccf8e;--bad:#ff6b78;--line:#2e2b45;--btn:#2a2740}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg)}
body{font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;touch-action:manipulation;overscroll-behavior:none}
#app{max-width:520px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 16px env(safe-area-inset-bottom)}
header{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 0 8px;font-weight:700}
#phase{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#timer{font-variant-numeric:tabular-nums;color:var(--accent)}
#x{min-height:36px;padding:4px 12px;font-size:14px;border-radius:12px}
#bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
#bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .25s linear}
main{flex:1;display:flex;flex-direction:column;gap:14px;padding:16px 0 20px}
h1,h2,h3{margin:0}
p{margin:0}
.card{background:var(--card);border-radius:20px;padding:20px;border:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
button{font:inherit;border:0;border-radius:16px;padding:14px;background:var(--btn);color:var(--fg);font-weight:600;cursor:pointer;min-height:56px}
button.pri{background:var(--accent);color:#fff}
button:active{transform:scale(.97)}
.grid{display:grid;gap:10px}.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}
#stage{flex:1;display:flex;flex-direction:column;justify-content:center;gap:16px;text-align:center;border:3px solid transparent;border-radius:20px;padding:8px;transition:border-color .1s}
#stage.good{border-color:var(--ok)}#stage.bad{border-color:var(--bad)}
.big{font-size:56px;font-weight:800;line-height:1.1}
.mid{font-size:34px;font-weight:800}
.hint{color:var(--muted);font-size:14px}
.cell{aspect-ratio:1;border-radius:12px;padding:0;min-height:0}
.cell.on{background:var(--accent)}.cell.miss{outline:3px solid var(--bad)}
.disp{font-size:36px;font-weight:700;min-height:48px;letter-spacing:4px;font-variant-numeric:tabular-nums}
.tile{padding:10px 0;min-height:48px;font-size:22px;min-width:46px;margin:3px}
.tile.u{background:var(--accent);color:#fff}
.lv{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--line);font-size:14px}
.dots i{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--line);margin-left:3px}
.dots i.on{background:var(--accent)}
textarea{width:100%;min-height:200px;border-radius:16px;border:1px solid var(--line);background:var(--card);color:var(--fg);font:inherit;padding:14px;resize:vertical;-webkit-user-select:text;user-select:text}
.read{font-size:18px;line-height:1.55;-webkit-user-select:text;user-select:text}
svg .n{stroke:var(--accent)}svg .f{stroke:var(--accent2)}
svg line{stroke-linecap:round;fill:none}svg .sh{stroke:var(--fg)}
.stat{display:flex;gap:10px}.stat>div{flex:1;background:var(--btn);border-radius:14px;padding:10px;text-align:center}
.stat b{display:block;font-size:24px}
</style>
</head>
<body>
<div id="app">
  <header><button id="x" hidden>✕</button><span id="phase">Gehirn Routine</span><span id="timer"></span></header>
  <div id="bar"><i></i></div>
  <main id="main"></main>
</div>
<script>
'use strict';
/* ---------- Helfer ---------- */
const $=s=>document.querySelector(s);
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuf=a=>{a=Array.from(a);for(let i=a.length-1;i>0;i--){const j=rnd(0,i);[a[i],a[j]]=[a[j],a[i]]}return a};
const store={
  get(k,d){try{const v=localStorage.getItem('gr_'+k);return v?JSON.parse(v):d}catch(e){return d}},
  set(k,v){try{localStorage.setItem('gr_'+k,JSON.stringify(v))}catch(e){}}
};
const vib=ms=>{try{navigator.vibrate&&navigator.vibrate(ms)}catch(e){}};
const mmss=s=>{s=Math.max(0,Math.ceil(s));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- Ablauf-Infrastruktur ---------- */
let cleanups=[],plan=[],idx=0,PDUR=[],results=[],session={};
function reset(){cleanups.forEach(f=>{try{f()}catch(e){}});cleanups=[]}
function render(html){reset();$('#main').innerHTML=html;window.scrollTo(0,0)}
function head(label,t){$('#phase').textContent=label;$('#timer').textContent=t==null?'':t}
function progress(frac){
  const tot=PDUR.reduce((a,b)=>a+b,0)||1;
  let done=0;for(let i=0;i<idx;i++)done+=PDUR[i];
  $('#bar i').style.width=Math.min(100,(done+PDUR[idx]*frac)/tot*100)+'%';
}
/* Countdown mit Zeitstempel (robust bei Hintergrund) */
function tick(sec,onEnd,base=0,span=1){
  const end=Date.now()+sec*1000;let fin=false;
  const upd=()=>{
    const left=(end-Date.now())/1000;
    $('#timer').textContent=mmss(left);
    progress(base+span*Math.min(1,1-left/sec));
    if(left<=0&&!fin){fin=true;clearInterval(iv);onEnd()}
  };
  const iv=setInterval(upd,200);cleanups.push(()=>{fin=true;clearInterval(iv)});upd();
}
function next(){idx++;go()}
function go(){
  const p=plan[idx];
  if(!p)return home();
  $('#x').hidden=false;
  ({move:moveAsk,read:readPhase,task:taskIntro,recall:recallPhase,end:endScreen})[p.k](p);
}
let xArm=0;
$('#x').onclick=()=>{
  if(Date.now()<xArm){home();return}
  xArm=Date.now()+3000;$('#x').textContent='Wirklich?';
  setTimeout(()=>{$('#x').textContent='✕'},3000);
};

/* ---------- Level / Statistik ---------- */
const lvOf=id=>(store.get('lv',{})[id])||0;
function setLv(id,v){const o=store.get('lv',{});o[id]=Math.max(0,Math.min(12,v));store.set('lv',o)}
function streak(){
  const days=new Set(store.get('days',[]));let n=0;const d=new Date();
  const key=x=>x.toISOString().slice(0,10);
  if(!days.has(key(d)))d.setDate(d.getDate()-1);
  while(days.has(key(d))){n++;d.setDate(d.getDate()-1)}
  return n;
}

/* ---------- Home ---------- */
function home(){
  reset();$('#x').hidden=true;head('Gehirn Routine','');$('#bar i').style.width='0';
  const rows=TASKS.map(t=>`<div class="lv"><span>${t.name}</span><span class="dots">${Array.from({length:6},(_,i)=>`<i class="${i<=Math.min(5,lvOf(t.id)/2|0)&&(lvOf(t.id)>0||i==0)?'on':''}"></i>`).join('')}<small class="hint"> Stufe ${lvOf(t.id)+1}</small></span></div>`).join('');
  $('#main').innerHTML=`
  <div class="card"><h1>🧠 Gehirn-Aktivierung</h1>
    <p class="hint">15 Minuten: Bewegung → Lesen → 4 Denkaufgaben → Abruf</p></div>
  <div class="stat"><div><b>${streak()}</b><span class="hint">Tage in Folge</span></div><div><b>${store.get('sessions',0)}</b><span class="hint">Durchläufe</span></div></div>
  <button class="pri" id="full">Routine starten (15 Min)</button>
  <button id="quick">Nur Denkaufgaben (5 Min)</button>
  <div class="card"><h3>Deine Stufen</h3>${rows}</div>
  <div class="card"><h3>Daten sichern</h3><p class="hint">Exportiere deinen Stand als Datei und lade ihn auf einem anderen Gerät wieder ein.</p>
  <div class="grid g2"><button id="exp">Exportieren</button><button id="imp">Importieren</button></div><input id="impf" type="file" accept="application/json,.json" hidden></div>`;
  $('#exp').onclick=exportData;
  $('#imp').onclick=()=>$('#impf').click();
  $('#impf').onchange=e=>importData(e.target.files[0]);
  $('#full').onclick=()=>startRoutine(false);
  $('#quick').onclick=()=>startRoutine(true);
}
function exportData(){
  const d={app:'gehirn-routine',v:1,lv:store.get('lv',{}),days:store.get('days',[]),sessions:store.get('sessions',0)};
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([JSON.stringify(d)],{type:'application/json'}));
  a.download='gehirn-routine-'+new Date().toISOString().slice(0,10)+'.json';
  document.body.appendChild(a);a.click();a.remove();
}
function importData(f){
  if(!f)return;
  f.text().then(t=>{
    const d=JSON.parse(t);if(d.app!=='gehirn-routine')throw 0;
    const days=[...new Set([...store.get('days',[]),...(d.days||[])])].sort();
    const lv=store.get('lv',{});for(const k in d.lv||{})lv[k]=Math.max(lv[k]||0,d.lv[k]);
    store.set('lv',lv);store.set('days',days);store.set('sessions',Math.max(store.get('sessions',0),d.sessions||0));
    home();
  }).catch(()=>alert('Die Datei konnte nicht gelesen werden.'));
}
function pickTasks(){
  const by=c=>shuf(TASKS.filter(t=>t.cat===c));
  const a=by('control')[0],b=by('memory')[0],c=by('math')[0];
  const rest=shuf(TASKS.filter(t=>![a,b,c].includes(t)))[0];
  return shuf([a,b,c,rest]);
}
function startRoutine(quick){
  const ts=pickTasks().map(T=>({k:'task',T}));
  plan=quick?[...ts,{k:'end'}]:[{k:'move'},{k:'read'},...ts,{k:'recall'},{k:'end'}];
  PDUR=plan.map(p=>({move:180,read:180,task:75,recall:180,end:1})[p.k]);
  idx=0;results=[];session={};
  try{navigator.wakeLock&&navigator.wakeLock.request('screen').catch(()=>{})}catch(e){}
  go();
}

/* ---------- Bewegung ---------- */
function moveAsk(){
  head('Bewegung','');progress(0);
  render(`<div class="card"><h2>Hast du dich heute schon bewegt?</h2><p class="hint">Wenn nicht, gibt es ein 3-Minuten-Workout, das den Kreislauf und damit das Gehirn weckt.</p></div>
  <div class="grid g2"><button id="y">Ja</button><button class="pri" id="n">Nein</button></div>`);
  $('#y').onclick=next;$('#n').onclick=workout;
}
const L={th:40,sh:40,to:50,ua:30,fa:27,hd:13};
const G=172;
const dir=a=>{const r=a*Math.PI/180;return[Math.sin(r),Math.cos(r)]};
const NUM={t:0,s:12,e:14,h:0,k:0,lift:0,dx:0,hx:0,hy:87.5,f1x:3,f1y:0,f2x:-3,f2y:0};
const norm=p=>{
  const o={...NUM,...p};
  for(const k of['s','e','h','k'])if(p[k+'2']===undefined)o[k+'2']=o[k];
  return o;
};
const mix=(a,b,w)=>{const o={};for(const k in a)o[k]=typeof a[k]==='number'?a[k]+(b[k]-a[k])*w:a[k];return o};
const add=(a,d,l)=>[a[0]+d[0]*l,a[1]+d[1]*l];
/* Bein per IK: Fuß bleibt am Boden, Knie zeigt nach vorn */
function ikLeg(hip,ax,fy){
  const ay=G-8-fy,m=L.th+L.sh-0.2;let a=[ax,ay],dx=ax-hip[0],dy=ay-hip[1],d=Math.hypot(dx,dy);
  if(d>m){a=[hip[0]+dx/d*m,hip[1]+dy/d*m];d=m}
  const ux=(a[0]-hip[0])/d,uy=(a[1]-hip[1])/d,hh=Math.sqrt(Math.max(0,L.th*L.th-d*d/4));
  let px=-uy,py=ux;if(px<0){px=-px;py=-py}
  const kn=[hip[0]+(a[0]-hip[0])/2+px*hh,hip[1]+(a[1]-hip[1])/2+py*hh];
  return{kn,ft:a,heel:[a[0]-3,a[1]+5],toe:[a[0]+13,fy>0?G-3:a[1]+5]};
}
function fkLeg(hip,h,k){
  const kn=add(hip,dir(h),L.th),a=add(kn,dir(h-k),L.sh);
  return{kn,ft:a,heel:[a[0]-3,a[1]+5],toe:[a[0]+13,a[1]+5]};
}
function skel(p){
  let hip,l1,l2;
  if(p.ik){
    hip=[120+p.hx,G-p.hy];l1=ikLeg(hip,120+p.f1x,p.f1y);l2=ikLeg(hip,120+p.f2x,p.f2y);
  }else{
    hip=[0,0];l1=fkLeg(hip,p.h,p.k);l2=fkLeg(hip,p.h2,p.k2);
    const maxY=Math.max(l1.kn[1],l2.kn[1],l1.ft[1],l2.ft[1]);
    const anchor=l1.ft[1]>=l2.ft[1]?l1.ft:l2.ft;
    const ox=120+p.dx-anchor[0],oy=G-8-maxY-p.lift;
    const mv=q=>[q[0]+ox,q[1]+oy],ml=l=>({kn:mv(l.kn),ft:mv(l.ft),heel:mv(l.heel),toe:mv(l.toe)});
    hip=mv(hip);l1=ml(l1);l2=ml(l2);
  }
  const up=[Math.sin(p.t*Math.PI/180),-Math.cos(p.t*Math.PI/180)];
  const sho=add(hip,up,L.to),neck=add(sho,up,8),hd=add(sho,up,L.hd+10);
  const arm=(s,e)=>{const el=add(sho,dir(s),L.ua);return{el,hn:add(el,dir(s+e),L.fa)}};
  return{hip,sho,neck,hd,l1,l2,a1:arm(p.s,p.e),a2:arm(p.s2,p.e2)};
}
function figSVG(p){
  const k=skel(norm(p)),f=q=>q[0].toFixed(1),g=q=>q[1].toFixed(1);
  const ln=(a,b,w,c)=>`<line class="${c}" x1="${f(a)}" y1="${g(a)}" x2="${f(b)}" y2="${g(b)}" style="stroke-width:${w}"/>`;
  const leg=(l,c)=>ln(k.hip,l.kn,15,c)+ln(l.kn,l.ft,12,c)+ln(l.heel,l.toe,9,'sh');
  const arm=(a,c,fill)=>ln(k.sho,a.el,11,c)+ln(a.el,a.hn,9,c)+`<circle cx="${f(a.hn)}" cy="${g(a.hn)}" r="5.5" style="fill:${fill}"/>`;
  const sx=(k.l1.ft[0]+k.l2.ft[0])/2;
  return`<ellipse cx="${sx.toFixed(1)}" cy="${G+1}" rx="46" ry="4" style="fill:var(--line)"/>`+
    arm(k.a2,'f','var(--accent2)')+leg(k.l2,'f')+
    ln(k.hip,k.sho,24,'n')+`<circle cx="${f(k.hip)}" cy="${g(k.hip)}" r="13" style="fill:var(--accent)"/>`+
    ln(k.sho,k.neck,8,'n')+
    `<circle cx="${f(k.hd)}" cy="${g(k.hd)}" r="${L.hd}" style="fill:var(--card);stroke:var(--accent);stroke-width:5"/>`+
    leg(k.l1,'n')+arm(k.a1,'n','var(--accent)');
}
const S0={ik:true,hx:0,hy:87.5};
const EX=[
 {n:'Kniebeugen',d:'Po nach hinten, Rücken gerade, Arme nach vorn.',per:4,K:[S0,{ik:true,hx:-24,hy:50,t:38,s:85,e:5},{ik:true,hx:-24,hy:50,t:38,s:85,e:5},S0]},
 {n:'Armkreise vorwärts',d:'Große, langsame Kreise aus der Schulter.',per:2.5,fn:ph=>({s:ph*360,e:0})},
 {n:'Armkreise rückwärts',d:'Kreise in die andere Richtung, Schultern locker.',per:2.5,fn:ph=>({s:-ph*360,e:0})},
 {n:'Hampelmann',d:'Arme hoch, Beine auseinander – locker springen.',per:1.2,K:[{},{s:170,e:0,h:22,h2:-22,lift:7}]},
 {n:'Kniehebelauf',d:'Knie abwechselnd hoch, Arme pumpen mit.',per:1,K:[{h:95,k:100,s:-40,e:70,s2:50,e2:70,lift:3},{h2:95,k2:100,s2:-40,e2:70,s:50,e:70,lift:3}]},
 {n:'Ausfallschritt',d:'Großer Schritt, hinteres Knie Richtung Boden.',per:4,K:[{ik:true,hx:0,hy:78,f1x:34,f2x:-34,s:-25,e:115},{ik:true,hx:3,hy:46,f1x:34,f2x:-34,f2y:12,s:-25,e:115},{ik:true,hx:3,hy:46,f1x:34,f2x:-34,f2y:12,s:-25,e:115},{ik:true,hx:0,hy:78,f1x:34,f2x:-34,s:-25,e:115}]},
 {n:'Wadenheben',d:'Auf die Zehenspitzen, kurz halten, absenken.',per:3,K:[S0,{ik:true,hx:0,hy:101.5,f1y:14,f2y:14},{ik:true,hx:0,hy:101.5,f1y:14,f2y:14},S0]},
 {n:'Vorbeuge',d:'Locker nach vorn hängen lassen, Nacken entspannen.',per:5,K:[S0,{ik:true,hx:-16,hy:83,t:84,s:4,e:0},{ik:true,hx:-16,hy:83,t:84,s:4,e:0},S0]},
 {n:'Reckdehnung',d:'Arme lang nach oben strecken, groß machen.',per:5,K:[{},{s:175,e:0,t:-8},{s:175,e:0,t:-8},{}]},
 {n:'Oberschenkel dehnen',d:'Ferse Richtung Po ziehen, Knie zeigt nach unten.',per:5,K:[{},{h2:-12,k2:140,s2:-35,t:-3},{h2:-12,k2:140,s2:-35,t:-3},{}]},
 {n:'Waden dehnen',d:'Hinteres Bein gestreckt, Ferse bleibt am Boden.',per:6,K:[{ik:true,hx:0,hy:75,f1x:38,f2x:-38},{ik:true,hx:23,hy:60,f1x:38,f2x:-38,t:22,s:88,e:0},{ik:true,hx:23,hy:60,f1x:38,f2x:-38,t:22,s:88,e:0},{ik:true,hx:0,hy:75,f1x:38,f2x:-38}]},
 {n:'Rumpfkreisen',d:'Hände in die Hüften, Oberkörper sanft kreisen.',per:3,fn:ph=>({t:30*Math.cos(ph*2*Math.PI),s:-30,e:110})},
 {n:'Schattenboxen',d:'Abwechselnd schnelle Schläge nach vorn.',per:0.9,K:[{s:90,e:0,s2:30,e2:120,h:15,k:25,h2:-15,k2:25,t:5},{s2:90,e2:0,s:30,e:120,h:15,k:25,h2:-15,k2:25,t:5}]},
 {n:'Fersenkicks',d:'Abwechselnd die Ferse zum Po schnellen.',per:1.1,K:[{h:-8,k:135,s:40,e:70,s2:-40,e2:70,lift:2},{h2:-8,k2:135,s2:40,e2:70,s:-40,e:70,lift:2}]},
 {n:'Marschieren',d:'Auf der Stelle marschieren, Knie hoch.',per:1.4,K:[{h:80,k:80,s:-35,e:20,s2:40,e2:20},{h2:80,k2:80,s2:-35,e2:20,s:40,e:20}]},
 {n:'Standwaage',d:'Oberkörper kippt vor, ein Bein nach hinten.',per:6,K:[{},{t:70,h2:-95,k2:0,s:160,s2:160},{t:70,h2:-95,k2:0,s:160,s2:160},{}]},
 {n:'Brust öffnen',d:'Arme nach hinten ziehen, Brust raus.',per:5,K:[{},{s:-70,e:0,t:-5},{s:-70,e:0,t:-5},{}]}
];
function poseAt(ex,ph){
  if(ex.fn)return ex.fn(ph);
  const K=ex.K.map(norm),n=K.length,x=(ph%1)*n,i=Math.floor(x),f=x-i;
  return mix(K[i],K[(i+1)%n],(1-Math.cos(Math.PI*f))/2);
}
function workout(){
  const exs=shuf(EX).slice(0,6);let i=0;
  const show=()=>{
    if(i>=6)return next();
    const ex=exs[i],nx=exs[i+1];
    head(`Übung ${i+1}/6`,'');vib(40);
    render(`<div class="card" style="text-align:center"><svg id="fig" viewBox="0 -16 240 206" style="width:100%;max-height:40vh"></svg><h2>${ex.n}</h2><p class="hint">${ex.d}</p></div>
    <p class="hint" style="text-align:center">${nx?'Danach: '+nx.n:'Letzte Übung!'}</p>`);
    const svg=$('#fig'),t0=performance.now();let raf;
    const loop=t=>{svg.innerHTML=figSVG(poseAt(ex,(((t-t0)/1000)/ex.per)%1));raf=requestAnimationFrame(loop)};
    raf=requestAnimationFrame(loop);cleanups.push(()=>cancelAnimationFrame(raf));
    tick(30,()=>{i++;show()},i/6,1/6);
  };
  show();
}

/* ---------- Lesen & Abruf ---------- */
const FALLBACK=[

async function getArticle(){
  for(let i=0;i<4;i++){
    try{
      const ctl=new AbortController(),to=setTimeout(()=>ctl.abort(),6000);
      const r=await fetch('https://de.wikipedia.org/api/rest_v1/page/random/summary',{signal:ctl.signal});
      clearTimeout(to);
      const j=await r.json();
      if(j.extract&&j.extract.length>=280&&j.extract.length<=1400&&j.type==='standard')return{title:j.title,text:j.extract,src:'Wikipedia'};
    }catch(e){break}
  }
  return{...pick(FALLBACK),src:'Offline-Text'};
}

/* ---------- Aufgaben-Engine ---------- */
function taskIntro(p){
  const T=p.T,lv=lvOf(T.id);
  head(T.name,'1:15');progress(0);
  render(`<div class="card"><span class="hint">Stufe ${lv+1}</span><h2>${T.name}</h2><p>${T.desc}</p></div><button class="pri" id="go">Los – 75 Sekunden</button>`);
  $('#go').onclick=()=>runTask(T);
}
function runTask(T){
  const lv=lvOf(T.id);
  render(`<div id="stage"></div>`);
  const c={ok:0,n:0,s:{},tid:0,locked:true,alive:true,T:[],el:$('#stage'),
    later(fn,ms){const id=this.tid,t=setTimeout(()=>{if(this.alive&&this.tid===id)fn()},ms);this.T.push(t)},
    answer(good){
      if(this.locked)return;this.locked=true;this.n++;if(good)this.ok++;else vib(60);
      this.el.className=good?'good':'bad';
      this.later(()=>this.next(),good?250:650);
    },
    next(){if(!this.alive)return;this.tid++;this.locked=false;this.el.className='';this.el.innerHTML='';T.trial(this,lv)}
  };
  cleanups.push(()=>{c.alive=false;c.T.forEach(clearTimeout)});
  c.next();
  head(T.name,'1:15');
  tick(75,()=>{c.alive=false;c.T.forEach(clearTimeout);taskResult(T,c)});
}
function taskResult(T,c){
  const lv=lvOf(T.id),acc=c.n?c.ok/c.n:0;let nl=lv,msg='Stufe bleibt gleich';
  if(c.n>=4&&acc>=0.85){nl=lv+1;msg='⬆ Stufe '+(nl+1)}
  else if(c.n>=4&&acc<0.55&&lv>0){nl=lv-1;msg='⬇ Stufe '+(nl+1)}
  setLv(T.id,nl);results.push({id:T.id,name:T.name,ok:c.ok,n:c.n,lv:nl});
  render(`<div class="card" style="text-align:center"><h2>${T.name}</h2><div class="big">${c.ok}/${c.n}</div><p class="hint">richtig · ${Math.round(acc*100)} %</p><p><b>${msg}</b></p></div>
  <button class="pri" id="nx">Weiter</button>`);
  head('Geschafft','');progress(1);
  $('#nx').onclick=next;
}
function btns(c,labels,correct,cls){
  c.el.insertAdjacentHTML('beforeend',`<div class="grid ${cls||'g2'}">${labels.map((t,i)=>`<button data-i="${i}">${t}</button>`).join('')}</div>`);
  c.el.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>c.answer(+b.dataset.i===correct));
}
function keypad(c,onSubmit){
  let v='';
  c.el.insertAdjacentHTML('beforeend',`<div class="disp" id="kd">&nbsp;</div><div class="grid g3" id="kp">${[1,2,3,4,5,6,7,8,9,'⌫',0,'✓'].map(k=>`<button data-k="${k}" class="${k==='✓'?'pri':''}">${k}</button>`).join('')}</div>`);
  const kd=c.el.querySelector('#kd');
  c.el.querySelectorAll('#kp button').forEach(b=>b.onclick=()=>{
    if(c.locked)return;const k=b.dataset.k;
    if(k==='⌫')v=v.slice(0,-1);
    else if(k==='✓'){if(v!=='')onSubmit(v);return}
    else if(v.length<10)v+=k;
    kd.textContent=v||' ';
  });
}

function seqGen(l){
  const P=['add','mul','alt','sq','fib','tri'],kind=pick(P.slice(0,Math.min(6,1+Math.floor(l/1.5)))),t=[];
  if(kind==='add'){let s=rnd(1,30),d=rnd(2,9+l);if(l>=3&&Math.random()<.4){s=rnd(50,99);d=-rnd(2,9)}for(let i=0;i<6;i++)t.push(s+d*i)}
  else if(kind==='mul'){let s=rnd(1,4),r=pick([2,3]);for(let i=0;i<6;i++)t.push(s*r**i)}
  else if(kind==='alt'){let s=rnd(5,25),a=rnd(2,9),b=rnd(1,5);for(let i=0;i<6;i++){t.push(s);s+=i%2?-b:a}}
  else if(kind==='sq'){let k=rnd(1,4),c=rnd(0,9);for(let i=0;i<6;i++)t.push((i+k)**2+c)}
  else if(kind==='fib'){t.push(rnd(1,4),rnd(1,5));for(let i=2;i<6;i++)t.push(t[i-1]+t[i-2])}
  else{let s=rnd(1,10),d=rnd(1,4),e=rnd(1,3);for(let i=0;i<6;i++){t.push(s);s+=d+i*e}}
  return t;
}
function mathQ(l){
  const m=Math.min(l,6);let a,b;
  if(m<2){a=rnd(3,12*(m+1));b=rnd(2,a);return Math.random()<.5?[`${a} + ${b}`,a+b]:[`${a} − ${b}`,a-b]}
  if(m<4){a=rnd(20,99);b=rnd(11,99);if(Math.random()<.5)return[`${a} + ${b}`,a+b];if(a<b)[a,b]=[b,a];return[`${a} − ${b}`,a-b]}
  if(m<6){a=rnd(3,12);b=rnd(3,12+(m-4)*8);return[`${a} × ${b}`,a*b]}
  a=rnd(12,29);b=rnd(3,9);const c=rnd(5,40);return[`${a} × ${b} + ${c}`,a*b+c];
}

  const rows=results.map(r=>`<div class="lv"><span>${r.name}</span><b>${r.ok}/${r.n}</b></div>`).join('');
  const rec=session.recall?['','Wenig','Einiges','Viel'][session.recall]:null;
  render(`<div class="card" style="text-align:center"><div class="big">🎉</div><h2>Gut gemacht!</h2><p class="hint">Dein Gehirn ist jetzt wach. ${streak()} Tag${streak()===1?'':'e'} in Folge.</p></div>
  <div class="card">${rows}${rec?`<div class="lv"><span>Abruf</span><b>${rec}</b></div>`:''}</div>
  <button class="pri" id="hm">Zum Start</button>`);
  $('#hm').onclick=home;
}

home();
try{if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}
</script>
</body>
</html>
