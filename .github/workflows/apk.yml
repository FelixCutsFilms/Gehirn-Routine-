name: APK bauen
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install
      - name: Web-Dateien bündeln
        run: |
          mkdir -p www
          cp index.html manifest.json sw.js icon-192.png icon-512.png www/
      - run: npx cap add android
      - name: Fester Signierschlüssel (damit Updates über die alte App gehen)
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS" ]; then
            mkdir -p ~/.android
            echo "$KS" | base64 -d > ~/.android/debug.keystore
            echo "Fester Schlüssel aktiv"
          else
            echo "::warning::Secret ANDROID_KEYSTORE_B64 fehlt - Zufallsschlüssel, die APK lässt sich nicht über eine ältere installieren"
          fi
      - name: Versionsnummer hochzählen
        run: sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/; s/versionName \"1.0\"/versionName \"1.${{ github.run_number }}\"/" android/app/build.gradle
      - run: npx capacitor-assets generate --android
      - run: npx cap sync android
      - name: APK bauen
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - name: APK umbenennen
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk gehirn-routine.apk
          keytool -printcert -jarfile gehirn-routine.apk | grep "SHA256" || true
      - uses: actions/upload-artifact@v4
        with:
          name: gehirn-routine-apk
          path: gehirn-routine.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: APK ${{ github.run_number }}
          files: gehirn-routine.apk
